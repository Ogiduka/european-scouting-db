name: European Scouting Import Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-importer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check FEB importer
        run: python -m py_compile feb_importer.py

